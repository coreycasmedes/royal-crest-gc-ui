name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # clean: true deletes anything not in dist/, so CNAME and .nojekyll must be in every build.
      # Not in public/: previews would copy them, and pr-preview-action leaves them behind on removal.
      - name: Add CNAME and .nojekyll
        run: |
          echo "www.royalcrestgc.com" > dist/CNAME
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          # Must match umbrella-dir in pr-preview.yml.
          clean-exclude: pr-preview/
          # Rebase instead of force-pushing, so a preview deployed meanwhile is not overwritten.
          force: false
