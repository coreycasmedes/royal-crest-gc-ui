<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#899878" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>Page not found | Royal Crest General Contractors</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f7f7f2;
        color: #222725;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 34rem; }
      .label {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #5f6e51;
        margin: 0 0 0.75rem;
      }
      h1 {
        font-size: clamp(2.2rem, 6vw, 3.2rem);
        font-weight: 700;
        line-height: 1.1;
        margin: 0 0 1.25rem;
      }
      p { line-height: 1.75; margin: 0 0 2rem; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
      .cta {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 1rem;
        background: #121113;
        color: #f7f7f2;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
      }
      .cta:hover { background: #5f6e51; }
      .phone { color: inherit; padding: 0.75rem 0.5rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Error 404</p>
      <h1>We couldn&rsquo;t find that page</h1>
      <p>

      </p>
      <div class="actions">
        <a class="cta" href="/">Go to the home page</a>
        <a class="phone" href="tel:+14694320341">(469) 432 0341</a>
      </div>
    </main>
  </body>
</html>
